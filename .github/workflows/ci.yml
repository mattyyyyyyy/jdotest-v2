name: CI

# 四件套：typecheck + test + build（+ lint 预留）。对应 task-plan §C 脚手架欠账。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: UI 护栏 - 死按钮（消费端屏交互控件空 handler）
        run: bash tools/check-dead-ui.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test（含覆盖率门槛 · TDD 的牙齿）
        # vitest run --coverage：覆盖率低于各包 vitest.config.ts 的 thresholds → exit 1 → CI 红
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate OpenSpec
        run: |
          npm i -g openspec@^1.3.0 || true
          if command -v openspec >/dev/null 2>&1; then openspec validate --all --strict; else echo "openspec CLI 不可用，跳过"; fi

  # Android 消费端 JVM 单测 + JaCoCo 覆盖率门槛（不需 emulator）。
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android unit tests + JaCoCo 覆盖率门槛（TDD 的牙齿）
        # jacocoUnitVerification 依赖 testDebugUnitTest；data/Catalog 行覆盖 < 门槛 → exit 1 → CI 红
        working-directory: apps/android-ivi
        run: ./gradlew :app:jacocoUnitVerification --no-daemon

  # Android 仪器测试（UI ↔ 后端接缝；需 emulator）。防「后端有数据但屏没显示 / 关键按钮被裁掉」这类坑。
  android-instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: 起后端（仪器测试经 10.0.2.2:3000 访问宿主机）
        run: |
          nohup pnpm --filter @jdo/api dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/bootstrap >/dev/null && { echo "backend up"; break; }
            sleep 2
          done
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 仪器测试（connectedDebugAndroidTest）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: apps/android-ivi
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
