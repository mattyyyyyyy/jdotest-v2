name: CI

# 四件套：typecheck + test + build（+ lint 预留）。对应 task-plan §C 脚手架欠账。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate OpenSpec
        run: |
          npm i -g openspec@^1.3.0 || true
          if command -v openspec >/dev/null 2>&1; then openspec validate --all --strict; else echo "openspec CLI 不可用，跳过"; fi

  # Android 消费端 JVM 单测（不需 emulator；仪器测试 connectedDebugAndroidTest 需模拟器，见 Q14，本 CI 不跑）。
  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android unit tests
        working-directory: apps/android-ivi
        run: ./gradlew :app:testDebugUnitTest --no-daemon
